version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smartbus-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=smartbus_db
    volumes:
      - mongo_data:/data/db
    networks:
      - smartbus-network

  service-discovery:
    build:
      context: ./backend/service-discovery
      dockerfile: Dockerfile
    container_name: smartbus-service-discovery
    restart: on-failure
    ports:
      - "8761:8761"
    environment:
      - EUREKA_SERVER_PORT=8761
    networks:
      - smartbus-network

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: smartbus-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
    depends_on:
      - service-discovery
    networks:
      - smartbus-network

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: smartbus-auth-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/smartbus_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - JWT_EXPIRATION_MS=86400000
    depends_on:
      - mongodb
      - service-discovery
    networks:
      - smartbus-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: smartbus-user-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/smartbus_db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-discovery:8761/eureka/
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      - mongodb
      - service-discovery
    networks:
      - smartbus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbus-frontend
    restart: on-failure
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - smartbus-network

volumes:
  mongo_data:
    driver: local

networks:
  smartbus-network:
    driver: bridge
